[layout]
    awesome_color = "skyblue"
    before_section_skip = "2pt"
    before_entry_skip = "2pt"
    before_entry_description_skip = "1pt"
    paper_size = "a4"
    date_width = "3.8cm"

    [layout.fonts]
        regular_fonts = ["Source Sans 3"]
        header_font = "Roboto"

    [layout.header]
        header_align = "left"
        display_profile_photo = true
        profile_photo_radius = "50%"
        info_font_size = "10pt"

    [layout.entry]
        display_entry_society_first = false
        display_logo = false

    [layout.section]
        title_highlight = "first-letters"
        title_highlight_letters = 3

    [layout.footer]
        display_page_counter = true
        display_footer = true

